<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flavor Wheel - Full-Screen Giant Arc & Wedge Rails</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #07090C;
      --surface-dark: #0F131C;
      --card-bg: rgba(22, 27, 34, 0.85);
      --card-border: rgba(245, 158, 11, 0.2);
      --amber-primary: #F59E0B;
      --amber-glow: rgba(245, 158, 11, 0.4);
      --amber-light: #FDE68A;
      --amber-dark: #B45309;
      --ruby-sherry: #DC2626;
      --emerald-sync: #10B981;
      --purple-custom: #A855F7;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
      --border-subtle: rgba(255, 255, 255, 0.08);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;

      /* 모션 토큰 */
      --duration-fast: 150ms;
      --duration-normal: 300ms;
      --ease-out-cubic: cubic-bezier(0.215, 0.61, 0.355, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background: radial-gradient(circle at top center, #1C1917 0%, #07090C 75%);
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    /* 모바일 디바이스 프레임 */
    .device-container {
      width: 100%;
      max-width: 420px;
      height: 890px;
      background: var(--surface-dark);
      border-radius: 44px;
      border: 6px solid #252A36;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.9),
                  0 0 45px rgba(245, 158, 11, 0.12);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* 상태바 */
    .status-bar {
      height: 38px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-sub);
      z-index: 30;
      flex-shrink: 0;
    }

    .dynamic-island {
      width: 96px;
      height: 22px;
      background: #000;
      border-radius: 20px;
      position: absolute;
      top: 9px;
      left: 50%;
      transform: translateX(-50%);
    }

    /* 상단 미니멀 플로팅 헤더 (위스키 & 대분류 타이틀) */
    .floating-top-header {
      position: absolute;
      top: 38px;
      left: 0;
      right: 0;
      padding: 8px 18px 12px;
      background: linear-gradient(to bottom, rgba(15, 19, 28, 0.95) 70%, transparent 100%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .whisky-badge-title {
      font-size: 13px;
      font-weight: 700;
      color: #FFF;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .whisky-badge-title span.sub {
      font-size: 10px;
      color: var(--amber-light);
      font-weight: 500;
    }

    .domain-selector {
      display: flex;
      gap: 4px;
    }
    .domain-pill {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border-subtle);
      color: var(--text-sub);
      padding: 2px 7px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 9px;
      transition: all var(--duration-fast) var(--ease-out-cubic);
    }
    .domain-pill.active {
      background: rgba(245, 158, 11, 0.25);
      border-color: var(--amber-primary);
      color: var(--amber-light);
      font-weight: 700;
    }

    /* 현재 선택된 대분류 포커스 배너 */
    .active-tier1-hero {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-top: 2px;
    }

    .tier1-hero-name {
      font-size: 18px;
      font-weight: 800;
      color: var(--amber-light);
      display: flex;
      align-items: center;
      gap: 6px;
      text-shadow: 0 0 14px rgba(245, 158, 11, 0.5);
    }

    .tier1-hero-score {
      font-size: 16px;
      font-weight: 800;
      color: var(--amber-primary);
    }

    .gesture-hint {
      font-size: 10px;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* ========================================================
       풀스크린 거대 휠 아크 캔버스 컨테이너 (화면 90% 차지)
       ======================================================== */
    .full-wheel-canvas-wrap {
      flex: 1;
      position: relative;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    .full-wheel-canvas-wrap:active {
      cursor: grabbing;
    }

    #giantArcCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* 회전 가이드 림 인디케이터 화살표 */
    .rim-guide-arrow {
      position: absolute;
      top: 22%;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid var(--border-subtle);
      color: var(--amber-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      pointer-events: none;
      opacity: 0.7;
      z-index: 20;
    }
    .rim-guide-arrow.left { left: 10px; }
    .rim-guide-arrow.right { right: 10px; }

    /* 하단 미니멀 플로팅 바 */
    .floating-bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px 18px 14px;
      background: linear-gradient(to top, var(--surface-dark) 85%, transparent 100%);
      z-index: 30;
      display: flex;
      gap: 10px;
    }

    .save-btn {
      flex: 1;
      padding: 12px;
      border-radius: var(--radius-md);
      background: linear-gradient(135deg, #F59E0B, #D97706);
      border: none;
      color: #090B0E;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.35);
      transition: all var(--duration-fast) var(--ease-out-cubic);
    }
    .save-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
    }

    .add-tier1-btn {
      padding: 12px 14px;
      border-radius: var(--radius-md);
      background: rgba(168, 85, 247, 0.15);
      border: 1px dashed var(--purple-custom);
      color: #E9D5FF;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      transition: all var(--duration-fast) var(--ease-out-cubic);
      white-space: nowrap;
    }
    .add-tier1-btn:hover {
      background: rgba(168, 85, 247, 0.3);
    }

    /* 모달 공통 */
    .modal-backdrop {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.show {
      display: flex;
      animation: fadeIn var(--duration-fast) var(--ease-out-cubic);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-box {
      width: 100%;
      background: var(--surface-dark);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 20px 18px;
      text-align: left;
    }
    .form-input {
      width: 100%;
      background: rgba(14, 17, 23, 0.8);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      color: var(--text-main);
      padding: 8px 10px;
      font-size: 12px;
      margin-bottom: 10px;
    }
    .form-label {
      font-size: 11px;
      color: var(--text-sub);
      margin-bottom: 4px;
      display: block;
      font-weight: 600;
    }
    .modal-close-btn {
      width: 100%;
      padding: 9px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border-subtle);
      color: var(--text-main);
      font-size: 11px;
      cursor: pointer;
    }

    /* 토스트 알림 */
    .toast-msg {
      position: absolute;
      top: 48px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      background: rgba(16, 185, 129, 0.95);
      color: #000;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
      opacity: 0;
      pointer-events: none;
      transition: all var(--duration-normal) var(--ease-out-cubic);
      z-index: 200;
      white-space: nowrap;
    }
    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="device-container">
    <!-- 상태 바 -->
    <div class="status-bar">
      <span>09:41</span>
      <div class="dynamic-island"></div>
      <span>5G 􀛨 100%</span>
    </div>

    <!-- 토스트 알림 -->
    <div class="toast-msg" id="toastMsg">💾 오프라인 로컬 저장 완료</div>

    <!-- 상단 미니멀 플로팅 헤더 -->
    <div class="floating-top-header">
      <div class="header-top-row">
        <div class="whisky-badge-title">
          <span>🥃 발베니 12년 더블우드</span>
          <span class="sub">• 40.0% ABV</span>
        </div>
        <div class="domain-selector">
          <span class="domain-pill active" onclick="switchDomain('whisky', this)">위스키</span>
          <span class="domain-pill" onclick="switchDomain('wine', this)">와인</span>
          <span class="domain-pill" onclick="switchDomain('coffee', this)">커피</span>
        </div>
      </div>

      <div class="active-tier1-hero">
        <div class="tier1-hero-name" id="heroName">
          <span id="heroIcon">🍯</span>
          <span id="heroTitle">달콤함 / 바닐라</span>
        </div>
        <div class="tier1-hero-score" id="heroScore">
          7.5 / 10
        </div>
      </div>

      <div class="gesture-hint">
        <span>🔄 상단 테두리를 돌려 대분류 전환</span>
        <span>👆 부채꼴 레일 위 노브를 밀어 점수 조절</span>
      </div>
    </div>

    <!-- ========================================================
         풀스크린 거대 휠 아크 캔버스 영역 (화면 90% 이상)
         ======================================================== -->
    <div class="full-wheel-canvas-wrap" id="canvasWrap">
      <canvas id="giantArcCanvas"></canvas>
      <div class="rim-guide-arrow left">◀</div>
      <div class="rim-guide-arrow right">▶</div>
    </div>

    <!-- 하단 미니멀 플로팅 바 -->
    <div class="floating-bottom-bar">
      <button class="add-tier1-btn" onclick="openAddTier1Modal()">
        <span>➕ 새 대분류</span>
      </button>
      <button class="save-btn" onclick="saveTastingNote()">
        <span>💾 테이스팅 노트 저장 (0ms)</span>
      </button>
    </div>

    <!-- 모달: 새 소분류 추가 -->
    <div class="modal-backdrop" id="addSubnodeModal">
      <div class="modal-box">
        <h4 style="color:#E9D5FF; font-size:13px; font-weight:700; margin-bottom:4px;">➕ 새 소분류 쐐기 레일 추가</h4>
        <p style="font-size:10px; color:var(--text-sub); margin-bottom:10px;">
          '<span id="modalTargetTier1" style="color:var(--amber-light); font-weight:600;">Sweet</span>' 섹터 안에 새 레일을 생성합니다.
        </p>

        <label class="form-label">소분류 향미 이름</label>
        <input type="text" class="form-input" id="newSubnodeName" placeholder="예: 군밤, 마시멜로, 메이플, 유자...">

        <label class="form-label">초기 강도 점수 (0.0 ~ 10.0)</label>
        <input type="range" class="form-input" id="newSubnodeSlider" min="0" max="100" value="70"
               oninput="document.getElementById('newSubVal').innerText = (this.value/10).toFixed(1)">
        <div style="text-align:right; font-size:11px; color:var(--amber-primary); font-weight:700; margin-bottom:12px;">
          <span id="newSubVal">7.0</span> / 10.0 점
        </div>

        <div style="display:flex; gap:8px;">
          <button class="save-btn" style="flex:1; background:linear-gradient(135deg, #A855F7, #7E22CE); color:#FFF;" onclick="confirmAddSubnode()">
            <span>레일 생성</span>
          </button>
          <button class="modal-close-btn" style="flex:1;" onclick="closeAddSubnodeModal()">취소</button>
        </div>
      </div>
    </div>

    <!-- 모달: 새 대분류 추가 -->
    <div class="modal-backdrop" id="addTier1Modal">
      <div class="modal-box">
        <h4 style="color:#E9D5FF; font-size:13px; font-weight:700; margin-bottom:4px;">➕ 새 대분류 부채꼴 섹터 추가</h4>
        <p style="font-size:10px; color:var(--text-sub); margin-bottom:10px;">
          거대 휠에 새로운 대분류 섹터를 추가합니다.
        </p>

        <label class="form-label">대분류 이름 (한글/영문)</label>
        <input type="text" class="form-input" id="newTier1Name" placeholder="예: 세이보리/감칠맛 (Savory)">

        <label class="form-label">아이콘 (이모지)</label>
        <input type="text" class="form-input" id="newTier1Icon" value="🍄" placeholder="예: 🍄, 🌿, 🍫, 🥜">

        <div style="display:flex; gap:8px; margin-top:10px;">
          <button class="save-btn" style="flex:1; background:linear-gradient(135deg, #A855F7, #7E22CE); color:#FFF;" onclick="confirmAddTier1()">
            <span>대분류 생성</span>
          </button>
          <button class="modal-close-btn" style="flex:1;" onclick="closeAddTier1Modal()">취소</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // ==========================================
    // 1. 도메인별 10점 척도 데이터 모델
    // ==========================================
    const DATA_DOMAINS = {
      whisky: {
        tier1: [
          {
            id: 'sweet', name: '달콤함/바닐라', en: 'Sweet', icon: '🍯',
            subnodes: [
              { id: 's_vanilla', name: '바닐라', score: 8.5, isCustom: false },
              { id: 's_honey', name: '벌꿀', score: 9.0, isCustom: false },
              { id: 's_caramel', name: '캐러멜', score: 6.5, isCustom: false },
              { id: 's_toffee', name: '토피', score: 5.5, isCustom: false }
            ]
          },
          {
            id: 'woody', name: '오크/우디', en: 'Woody', icon: '🪵',
            subnodes: [
              { id: 'w_oak', name: '새 오크', score: 7.8, isCustom: false },
              { id: 'w_cedar', name: '삼나무', score: 6.0, isCustom: false },
              { id: 'w_leather', name: '가죽', score: 7.0, isCustom: false }
            ]
          },
          {
            id: 'winey', name: '와인/셰리', en: 'Winey', icon: '🍷',
            subnodes: [
              { id: 'wi_sherry', name: '셰리 와인', score: 8.2, isCustom: false },
              { id: 'wi_raisin', name: '건포도', score: 6.5, isCustom: false }
            ]
          },
          {
            id: 'fruity', name: '과일/프루티', en: 'Fruity', icon: '🍎',
            subnodes: [
              { id: 'f_apple', name: '사과/배', score: 6.5, isCustom: false },
              { id: 'f_citrus', name: '시트러스', score: 4.8, isCustom: false },
              { id: 'f_dried', name: '건과일', score: 7.2, isCustom: false }
            ]
          },
          {
            id: 'malty', name: '곡물/몰트', en: 'Malty', icon: '🌾',
            subnodes: [
              { id: 'm_barley', name: '보리/맥아', score: 6.8, isCustom: false },
              { id: 'm_biscuit', name: '비스킷', score: 5.0, isCustom: false }
            ]
          },
          {
            id: 'spicy', name: '스파이스', en: 'Spicy', icon: '🌶️',
            subnodes: [
              { id: 'sp_cinnamon', name: '시나몬', score: 6.0, isCustom: false },
              { id: 'sp_pepper', name: '흑후추', score: 3.5, isCustom: false }
            ]
          },
          {
            id: 'floral', name: '꽃/플로럴', en: 'Floral', icon: '🌸',
            subnodes: [
              { id: 'fl_wild', name: '들꽃', score: 4.2, isCustom: false },
              { id: 'fl_herb', name: '풀내음', score: 3.0, isCustom: false }
            ]
          },
          {
            id: 'smoky', name: '피트/스모키', en: 'Peaty', icon: '🔥',
            subnodes: [
              { id: 'sm_smoke', name: '훈연', score: 2.2, isCustom: false },
              { id: 'sm_peat', name: '이탄', score: 1.2, isCustom: false }
            ]
          }
        ]
      },
      wine: {
        tier1: [
          {
            id: 'black_fruit', name: '블랙프루트', en: 'Black Fruit', icon: '🫐',
            subnodes: [
              { id: 'bf_cassis', name: '카시스', score: 9.2, isCustom: false },
              { id: 'bf_blackberry', name: '블랙베리', score: 8.5, isCustom: false }
            ]
          },
          {
            id: 'oak_wine', name: '프렌치오크', en: 'French Oak', icon: '🪵',
            subnodes: [
              { id: 'ow_cedar', name: '시더우드', score: 8.2, isCustom: false },
              { id: 'ow_vanilla', name: '바닐라빈', score: 7.0, isCustom: false }
            ]
          },
          {
            id: 'floral_wine', name: '플로럴', en: 'Floral', icon: '🌸',
            subnodes: [
              { id: 'fw_violet', name: '제비꽃', score: 8.5, isCustom: false }
            ]
          }
        ]
      },
      coffee: {
        tier1: [
          {
            id: 'jasmine', name: '자스민/꽃', en: 'Floral', icon: '🌼',
            subnodes: [
              { id: 'j_flower', name: '자스민', score: 9.6, isCustom: false },
              { id: 'j_tea', name: '백차', score: 8.9, isCustom: false }
            ]
          },
          {
            id: 'citrus', name: '시트러스', en: 'Citrus', icon: '🍋',
            subnodes: [
              { id: 'c_bergamot', name: '베르가못', score: 9.2, isCustom: false }
            ]
          }
        ]
      }
    };

    let currentDomain = 'whisky';
    let currentTier1List = DATA_DOMAINS.whisky.tier1;
    let selectedTier1Index = 0;

    // 휠 물리 & 각도 관리
    let wheelAngle = 0; // 현재 휠 회전 각도
    let targetWheelAngle = 0; // 목표 스냅 각도
    let isSpinningWheel = false;
    let spinStartAngle = 0;
    let spinInitialAngle = 0;

    // 쐐기 레일 위 노브 드래그 상태
    let activeDraggingKnob = null; // { tier1Idx, subnodeIdx }

    let canvas, ctx;

    window.onload = () => {
      canvas = document.getElementById('giantArcCanvas');
      ctx = canvas.getContext('2d');

      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      setupInChartGestures();
      snapToTier1(0);
      startRenderLoop();
    };

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
    }

    // ==========================================
    // 2. 줌인 풀스크린 거대 휠 & 쐐기 레일 렌더러 (60fps)
    // ==========================================
    function startRenderLoop() {
      function frame() {
        // 휠 마그네틱 스냅 보간
        if (!isSpinningWheel) {
          const diff = targetWheelAngle - wheelAngle;
          if (Math.abs(diff) > 0.001) {
            wheelAngle += diff * 0.16;
          } else {
            wheelAngle = targetWheelAngle;
          }
        }

        drawFullScreenGiantArc();
        requestAnimationFrame(frame);
      }
      requestAnimationFrame(frame);
    }

    function getGiantGeometry() {
      const w = canvas.width;
      const h = canvas.height;
      // 가상 원의 중심: 화면 하단 아래쪽으로 깊숙이 배치
      const cx = w / 2;
      const cy = h * 1.16;
      // 화면 90%를 가득 채우는 거대 반경
      const maxR = h * 0.96;
      const minR = h * 0.28;
      return { w, h, cx, cy, maxR, minR };
    }

    function drawFullScreenGiantArc() {
      const { w, h, cx, cy, maxR, minR } = getGiantGeometry();
      ctx.clearRect(0, 0, w, h);

      const count = currentTier1List.length;
      const sectorSpan = (Math.PI * 2) / count;

      // 1. 10점 척도 배경 동심원 눈금 호 (2, 4, 6, 8, 10)
      for (let level = 2; level <= 10; level += 2) {
        const r = minR + ((maxR - minR) / 10) * level;
        ctx.beginPath();
        ctx.arc(cx, cy, r, -Math.PI * 0.95, -Math.PI * 0.05);
        ctx.strokeStyle = level === 10 ? 'rgba(245, 158, 11, 0.45)' : 'rgba(255, 255, 255, 0.08)';
        ctx.lineWidth = level === 10 ? 3 : 1.2;
        ctx.stroke();

        // 눈금 숫자
        ctx.font = '600 16px Pretendard';
        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.textAlign = 'right';
        ctx.fillText(`${level}`, cx - 24, cy - r);
      }

      // 2. 각 대분류 부채꼴 섹터 렌더링
      currentTier1List.forEach((t1, i) => {
        // 12시 방향(-PI/2) 기준 각도 계산
        const baseAngle = -Math.PI / 2 + (i * sectorSpan) + wheelAngle;
        const startAngle = baseAngle - sectorSpan / 2;
        const endAngle = baseAngle + sectorSpan / 2;

        const isCurrent = (i === selectedTier1Index);

        // 대분류 섹터 경계선
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(cx + maxR * 1.08 * Math.cos(startAngle), cy + maxR * 1.08 * Math.sin(startAngle));
        ctx.strokeStyle = isCurrent ? 'rgba(245, 158, 11, 0.6)' : 'rgba(255, 255, 255, 0.15)';
        ctx.lineWidth = isCurrent ? 2.5 : 1.2;
        ctx.stroke();

        // 외곽 림(Rim) 아크 라벨
        const labelR = maxR + 32;
        const lx = cx + labelR * Math.cos(baseAngle);
        const ly = cy + labelR * Math.sin(baseAngle);

        ctx.font = isCurrent ? '800 24px Pretendard' : '600 18px Pretendard';
        ctx.fillStyle = isCurrent ? '#FDE68A' : 'rgba(255, 255, 255, 0.4)';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(`${t1.icon} ${t1.name.split('/')[0]}`, lx, ly);

        // 3. [핵심] 섹터 내부: 소분류별 부채꼴 쐐기 레일(Wedge Rails) 렌더링
        const subCount = t1.subnodes.length;
        const totalWedges = subCount + 1; // 마지막은 [+] 새 소분류 레일
        const wedgeSpan = sectorSpan / totalWedges;

        // 대분류 평균 계산
        let sum = 0;
        t1.subnodes.forEach(s => sum += s.score);
        t1.avgScore = subCount > 0 ? (sum / subCount) : 0;

        t1.subnodes.forEach((sub, sIdx) => {
          const wStart = startAngle + (sIdx * wedgeSpan);
          const wEnd = wStart + wedgeSpan;
          const wMid = (wStart + wEnd) / 2;

          const fillR = minR + ((maxR - minR) / 10) * sub.score;

          // 쐐기 레일 배경 게이지 채우기 (네온 차오름)
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, fillR, wStart + 0.015, wEnd - 0.015);
          ctx.closePath();

          if (isCurrent) {
            const grad = ctx.createRadialGradient(cx, cy, minR, cx, cy, maxR);
            grad.addColorStop(0, 'rgba(245, 158, 11, 0.6)');
            grad.addColorStop(1, 'rgba(220, 38, 38, 0.35)');
            ctx.fillStyle = grad;
          } else {
            ctx.fillStyle = 'rgba(245, 158, 11, 0.15)';
          }
          ctx.fill();

          // 쐐기 레일 외곽선
          ctx.beginPath();
          ctx.arc(cx, cy, fillR, wStart + 0.015, wEnd - 0.015);
          ctx.strokeStyle = isCurrent ? '#FBBF24' : 'rgba(255, 255, 255, 0.2)';
          ctx.lineWidth = isCurrent ? 3 : 1.5;
          ctx.stroke();

          // 쐐기 레일 중심 방사형 가이드 레일 라인
          ctx.beginPath();
          ctx.moveTo(cx + minR * Math.cos(wMid), cy + minR * Math.sin(wMid));
          ctx.lineTo(cx + maxR * Math.cos(wMid), cy + maxR * Math.sin(wMid));
          ctx.strokeStyle = isCurrent ? 'rgba(255, 255, 255, 0.2)' : 'rgba(255, 255, 255, 0.06)';
          ctx.lineWidth = 1;
          ctx.stroke();

          // 레일 위 슬라이드 노브(Knob) 렌더링
          const kx = cx + fillR * Math.cos(wMid);
          const ky = cy + fillR * Math.sin(wMid);

          ctx.beginPath();
          ctx.arc(kx, ky, isCurrent ? 14 : 7, 0, Math.PI * 2);
          ctx.fillStyle = isCurrent ? '#FFF' : '#F59E0B';
          ctx.fill();
          ctx.strokeStyle = '#000';
          ctx.lineWidth = isCurrent ? 4 : 2;
          if (isCurrent) {
            ctx.shadowColor = 'rgba(245, 158, 11, 0.9)';
            ctx.shadowBlur = 14;
          }
          ctx.stroke();
          ctx.shadowBlur = 0;

          // 소분류 이름 & 현재 점수 라벨
          if (isCurrent) {
            const labelDist = fillR > maxR * 0.7 ? fillR - 38 : fillR + 38;
            const lx = cx + labelDist * Math.cos(wMid);
            const ly = cy + labelDist * Math.sin(wMid);

            ctx.font = '700 16px Pretendard';
            ctx.fillStyle = '#FFF';
            ctx.textAlign = 'center';
            ctx.fillText(sub.name, lx, ly - 10);

            ctx.font = '800 15px Pretendard';
            ctx.fillStyle = '#F59E0B';
            ctx.fillText(`${sub.score.toFixed(1)}`, lx, ly + 12);
          }
        });

        // 마지막 쐐기 레일: [➕ 새 소분류 추가] 레일
        if (isCurrent) {
          const addWStart = startAngle + (subCount * wedgeSpan);
          const addWEnd = addWStart + wedgeSpan;
          const addWMid = (addWStart + addWEnd) / 2;
          const addR = minR + ((maxR - minR) / 10) * 5.0;

          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.arc(cx, cy, maxR * 0.85, addWStart + 0.015, addWEnd - 0.015);
          ctx.closePath();
          ctx.fillStyle = 'rgba(168, 85, 247, 0.08)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(168, 85, 247, 0.4)';
          ctx.lineWidth = 1.5;
          ctx.setLineDash([4, 4]);
          ctx.stroke();
          ctx.setLineDash([]);

          const ax = cx + addR * Math.cos(addWMid);
          const ay = cy + addR * Math.sin(addWMid);

          ctx.beginPath();
          ctx.arc(ax, ay, 16, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(168, 85, 247, 0.3)';
          ctx.fill();
          ctx.strokeStyle = '#D8B4FE';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.font = 'bold 18px Pretendard';
          ctx.fillStyle = '#E9D5FF';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('+', ax, ay);

          ctx.font = '600 12px Pretendard';
          ctx.fillStyle = '#D8B4FE';
          ctx.fillText('새 소분류', ax, ay + 26);
        }
      });
    }

    // ==========================================
    // 3. 인차트 제스처: 외곽 림 회전 vs 쐐기 레일 노브 슬라이드
    // ==========================================
    function setupInChartGestures() {
      const wrap = document.getElementById('canvasWrap');

      let isKnobDragMode = false;
      let isRimSpinMode = false;

      const getPos = (e) => {
        const rect = canvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: (clientX - rect.left) * (canvas.width / rect.width),
          y: (clientY - rect.top) * (canvas.height / rect.height)
        };
      };

      const onDown = (e) => {
        const { x, y } = getPos(e);
        const { cx, cy, maxR, minR } = getGiantGeometry();

        const count = currentTier1List.length;
        const sectorSpan = (Math.PI * 2) / count;
        const baseAngle = -Math.PI / 2 + (selectedTier1Index * sectorSpan) + wheelAngle;
        const startAngle = baseAngle - sectorSpan / 2;

        const t1 = currentTier1List[selectedTier1Index];
        const subCount = t1.subnodes.length;
        const totalWedges = subCount + 1;
        const wedgeSpan = sectorSpan / totalWedges;

        // 1. 소분류 노브 터치 판정
        let hitSubIdx = -1;
        for (let sIdx = 0; sIdx < subCount; sIdx++) {
          const sub = t1.subnodes[sIdx];
          const wStart = startAngle + (sIdx * wedgeSpan);
          const wMid = wStart + wedgeSpan / 2;
          const fillR = minR + ((maxR - minR) / 10) * sub.score;

          const kx = cx + fillR * Math.cos(wMid);
          const ky = cy + fillR * Math.sin(wMid);

          if (Math.sqrt((x - kx) ** 2 + (y - ky) ** 2) < 42) {
            hitSubIdx = sIdx;
            break;
          }
        }

        // 2. [+] 새 소분류 레일 탭 판정
        const addWMid = startAngle + (subCount * wedgeSpan) + wedgeSpan / 2;
        const addR = minR + ((maxR - minR) / 10) * 5.0;
        const ax = cx + addR * Math.cos(addWMid);
        const ay = cy + addR * Math.sin(addWMid);
        if (Math.sqrt((x - ax) ** 2 + (y - ay) ** 2) < 38) {
          openAddSubnodeModal();
          return;
        }

        if (hitSubIdx !== -1) {
          isKnobDragMode = true;
          activeDraggingKnob = { tier1Idx: selectedTier1Index, subnodeIdx: hitSubIdx };
        } else {
          // 3. 외곽 림 / 휠 전체 회전 제스처 모드
          isRimSpinMode = true;
          isSpinningWheel = true;
          spinStartAngle = Math.atan2(y - cy, x - cx);
          spinInitialAngle = wheelAngle;
        }
      };

      const onMove = (e) => {
        if (!isKnobDragMode && !isRimSpinMode) return;
        const { x, y } = getPos(e);
        const { cx, cy, maxR, minR } = getGiantGeometry();

        if (isKnobDragMode && activeDraggingKnob) {
          // 쐐기 레일 위 노브 드래그 (중심 -> 외곽 반경 거리)
          const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
          let newScore = ((dist - minR) / (maxR - minR)) * 10;
          newScore = Math.min(10.0, Math.max(0.0, newScore));

          const sub = currentTier1List[activeDraggingKnob.tier1Idx].subnodes[activeDraggingKnob.subnodeIdx];
          sub.score = Math.round(newScore * 10) / 10;

          updateHeroBanner();
        } else if (isRimSpinMode) {
          // 휠 각도 회전
          const curAngle = Math.atan2(y - cy, x - cx);
          const delta = curAngle - spinStartAngle;
          wheelAngle = spinInitialAngle + delta;

          // 가장 가까운 대분류 인덱스 실시간 추적
          const count = currentTier1List.length;
          const sectorSpan = (Math.PI * 2) / count;
          let idx = Math.round(-wheelAngle / sectorSpan) % count;
          if (idx < 0) idx += count;
          if (selectedTier1Index !== idx) {
            selectedTier1Index = idx;
            updateHeroBanner();
          }
        }
      };

      const onUp = () => {
        if (isRimSpinMode) {
          isRimSpinMode = false;
          isSpinningWheel = false;
          // 마그네틱 스냅
          const count = currentTier1List.length;
          const sectorSpan = (Math.PI * 2) / count;
          let snapIdx = Math.round(-wheelAngle / sectorSpan) % count;
          if (snapIdx < 0) snapIdx += count;
          snapToTier1(snapIdx);
        }
        isKnobDragMode = false;
        activeDraggingKnob = null;
      };

      wrap.addEventListener('mousedown', onDown);
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);

      wrap.addEventListener('touchstart', onDown, { passive: true });
      window.addEventListener('touchmove', onMove, { passive: true });
      window.addEventListener('touchend', onUp);
    }

    function snapToTier1(idx) {
      selectedTier1Index = idx;
      const count = currentTier1List.length;
      const sectorSpan = (Math.PI * 2) / count;
      targetWheelAngle = -idx * sectorSpan;
      updateHeroBanner();
    }

    function updateHeroBanner() {
      const t1 = currentTier1List[selectedTier1Index];
      document.getElementById('heroIcon').innerText = t1.icon;
      document.getElementById('heroTitle').innerText = `${t1.name} (${t1.en || 'Custom'})`;

      let sum = 0;
      t1.subnodes.forEach(s => sum += s.score);
      const avg = t1.subnodes.length > 0 ? (sum / t1.subnodes.length) : 0;
      document.getElementById('heroScore').innerText = `${avg.toFixed(1)} / 10`;
    }

    // ==========================================
    // 4. 모달 인터랙션 (새 소분류 / 새 대분류)
    // ==========================================
    function openAddSubnodeModal() {
      const t1 = currentTier1List[selectedTier1Index];
      document.getElementById('modalTargetTier1').innerText = `${t1.icon} ${t1.name}`;
      document.getElementById('newSubnodeName').value = '';
      document.getElementById('newSubnodeSlider').value = 70;
      document.getElementById('newSubVal').innerText = '7.0';
      document.getElementById('addSubnodeModal').classList.add('show');
    }
    function closeAddSubnodeModal() {
      document.getElementById('addSubnodeModal').classList.remove('show');
    }
    function confirmAddSubnode() {
      const name = document.getElementById('newSubnodeName').value.trim();
      if (!name) { alert('소분류 이름을 입력해 주세요!'); return; }
      const score = parseFloat(document.getElementById('newSubnodeSlider').value) / 10;
      const t1 = currentTier1List[selectedTier1Index];

      t1.subnodes.push({
        id: `sub_custom_${Date.now()}`,
        name: name,
        score: score,
        isCustom: true
      });

      closeAddSubnodeModal();
      updateHeroBanner();
      showToast(`✨ 섹터 내에 '${name}' (${score.toFixed(1)}점) 쐐기 레일 추가 완료!`);
    }

    function openAddTier1Modal() {
      document.getElementById('newTier1Name').value = '';
      document.getElementById('newTier1Icon').value = '🍄';
      document.getElementById('addTier1Modal').classList.add('show');
    }
    function closeAddTier1Modal() {
      document.getElementById('addTier1Modal').classList.remove('show');
    }
    function confirmAddTier1() {
      const name = document.getElementById('newTier1Name').value.trim();
      if (!name) { alert('대분류 이름을 입력해 주세요!'); return; }
      const icon = document.getElementById('newTier1Icon').value.trim() || '✨';

      const newT1 = {
        id: `t1_custom_${Date.now()}`,
        name: name,
        en: 'Custom',
        icon: icon,
        isCustom: true,
        subnodes: [
          { id: `sub_${Date.now()}_1`, name: `${name.split('/')[0]} 1`, score: 6.0, isCustom: true }
        ]
      };

      currentTier1List.push(newT1);
      closeAddTier1Modal();
      snapToTier1(currentTier1List.length - 1);
      showToast(`✨ 거대 휠에 새 대분류 '${name}' 섹터 생성 완료!`);
    }

    function switchDomain(domain, pill) {
      currentDomain = domain;
      document.querySelectorAll('.domain-pill').forEach(el => el.classList.remove('active'));
      pill.classList.add('active');

      const d = DATA_DOMAINS[domain];
      currentTier1List = d.tier1;

      snapToTier1(0);
      showToast(`⚡ '${domain.toUpperCase()}' 풀스크린 거대 휠 로드 완료`);
    }

    function showToast(msg) {
      const toast = document.getElementById('toastMsg');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function saveTastingNote() {
      showToast('💾 Isar DB 로컬 영속화 완료 & 🌟 제안 큐 적재됨 (0ms)');
    }
  </script>
